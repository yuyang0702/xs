[project]
name = "novel-flywheel-console"
version = "0.1.0"
description = "Local multi-model novel writing workflow console"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "keyring>=25,<26",
  "pypdf>=5,<6",
  "crewai>=1.15,<2",
  "markdown-it-py>=3,<5",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6,<7",
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "respx>=0.22,<1",
]

[project.scripts]
novel-flywheel = "novel_flywheel.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novel_flywheel"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
